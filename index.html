<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sacá tu Foto 🦋</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at 50% 30%, #15092b 0%, #06020c 70%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            position: relative;
            padding: 20px 10px;
        }

        /* --- MARIPOSAS DE FONDO RESPONSIVAS --- */
        .butterfly {
            position: fixed;
            pointer-events: none;
            z-index: 1;
            filter: drop-shadow(0 0 15px rgba(0, 191, 255, 0.6)) drop-shadow(0 0 30px rgba(138, 43, 226, 0.4));
            opacity: 0.85;
            animation: flutter 6s ease-in-out infinite alternate;
        }

        /* Definición de cada mariposa (tamaños y posiciones seguras para móvil) */
        .bf-top-left {
            top: 6%;
            left: -15px;
            width: 55px;
            height: auto;
            transform: rotate(25deg);
            animation-delay: 0s;
        }
        .bf-mid-left {
            top: 45%;
            left: -10px;
            width: 45px;
            height: auto;
            transform: rotate(-15deg);
            animation-delay: 1.5s;
        }
        .bf-bottom-left {
            bottom: 3%;
            left: 5%;
            width: 70px;
            height: auto;
            transform: rotate(15deg);
            animation-delay: 0.5s;
        }
        .bf-top-right {
            top: 15%;
            right: -10px;
            width: 65px;
            height: auto;
            transform: rotate(-35deg) scaleX(-1);
            animation-delay: 1s;
        }
        .bf-mid-right {
            top: 55%;
            right: -5px;
            width: 40px;
            height: auto;
            transform: rotate(20deg);
            animation-delay: 2s;
        }
        .bf-bottom-right {
            bottom: 4%;
            right: 4%;
            width: 75px;
            height: auto;
            transform: rotate(-10deg);
            animation-delay: 1.2s;
        }

        /* --- EFECTO DE ANIMACIÓN SUTIL --- */
        @keyframes flutter {
            0% { transform: translateY(0) rotate(var(--r, 0deg)) scale(1); }
            50% { transform: translateY(-5px) rotate(calc(var(--r, 0deg) + 5deg)) scale(1.03); }
            100% { transform: translateY(3px) rotate(calc(var(--r, 0deg) - 3deg)) scale(0.97); }
        }

        /* --- TARJETA PRINCIPAL --- */
        .card-container {
            width: 100%;
            max-width: 375px; /* Evita que ocupe todo el ancho y tape las mariposas */
            background: rgba(18, 18, 24, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 24px 18px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2; /* Por encima de las mariposas */
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* --- ENCABEZADOS --- */
        h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.7rem;
            letter-spacing: 1px;
            color: #ffffff;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-shadow: 0 0 12px rgba(0, 191, 255, 0.4);
        }

        p.subtitle {
            font-size: 0.85rem;
            color: #a0a0b0;
            margin-bottom: 20px;
            font-weight: 300;
        }

        /* --- CONTENEDOR DE LA CÁMARA --- */
        .camera-box {
            width: 100%;
            aspect-ratio: 3 / 4; /* Proporción estándar de foto vertical */
            background: #000;
            border-radius: 18px;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        video, canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* --- BOTÓN --- */
        .btn-capture {
            width: 100%;
            padding: 16px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #0b071a;
            background: linear-gradient(135deg, #ffffff 0%, #aed2f6 50%, #7aa2e3 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(122, 162, 227, 0.3), 
                        inset 0 -3px 0px rgba(0, 0, 0, 0.15);
            transition: all 0.2s ease;
        }

        .btn-capture:active {
            transform: scale(0.98);
            box-shadow: 0 4px 10px rgba(122, 162, 227, 0.2);
        }

        /* Adaptación para pantallas ultra pequeñas */
        @media (max-width: 360px) {
            .card-container {
                padding: 18px 12px;
            }
            h1 { font-size: 1.4rem; }
            .butterfly { transform: scale(0.85); }
        }
    </style>
</head>
<body>

    <!-- MARIPOSAS DE FONDO (SVG con degradados brillantes) -->
    <!-- Superior Izquierda -->
    <svg class="butterfly bf-top-left" style="--r: 25deg;" viewBox="0 0 100 100">
        <defs>
            <linearGradient id="butterfly-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00f2fe" />
                <stop offset="100%" stop-color="#4facfe" />
            </linearGradient>
        </defs>
        <path fill="url(#butterfly-grad-1)" d="M50,50 C45,30 25,10 10,25 C0,35 15,60 30,55 C15,65 5,85 20,95 C35,100 45,75 50,60 C55,75 65,100 80,95 C95,85 85,65 70,55 C85,60 100,35 90,25 C75,10 55,30 50,50 Z" />
    </svg>

    <!-- Superior Derecha -->
    <svg class="butterfly bf-top-right" style="--r: -35deg;" viewBox="0 0 100 100">
        <defs>
            <linearGradient id="butterfly-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#b19ffb" />
                <stop offset="100%" stop-color="#7000ff" />
            </linearGradient>
        </defs>
        <path fill="url(#butterfly-grad-2)" d="M50,50 C45,30 25,10 10,25 C0,35 15,60 30,55 C15,65 5,85 20,95 C35,100 45,75 50,60 C55,75 65,100 80,95 C95,85 85,65 70,55 C85,60 100,35 90,25 C75,10 55,30 50,50 Z" />
    </svg>

    <!-- Medio Izquierda -->
    <svg class="butterfly bf-mid-left" style="--r: -15deg;" viewBox="0 0 100 100">
        <path fill="url(#butterfly-grad-2)" d="M50,50 C45,30 25,10 10,25 C0,35 15,60 30,55 C15,65 5,85 20,95 C35,100 45,75 50,60 C55,75 65,100 80,95 C95,85 85,65 70,55 C85,60 100,35 90,25 C75,10 55,30 50,50 Z" />
    </svg>

    <!-- Inferior Izquierda -->
    <svg class="butterfly bf-bottom-left" style="--r: 15deg;" viewBox="0 0 100 100">
        <path fill="url(#butterfly-grad-1)" d="M50,50 C45,30 25,10 10,25 C0,35 15,60 30,55 C15,65 5,85 20,95 C35,100 45,75 50,60 C55,75 65,100 80,95 C95,85 85,65 70,55 C85,60 100,35 90,25 C75,10 55,30 50,50 Z" />
    </svg>

    <!-- Medio Derecha -->
    <svg class="butterfly bf-mid-right" style="--r: 20deg;" viewBox="0 0 100 100">
        <path fill="url(#butterfly-grad-1)" d="M50,50 C45,30 25,10 10,25 C0,35 15,60 30,55 C15,65 5,85 20,95 C35,100 45,75 50,60 C55,75 65,100 80,95 C95,85 85,65 70,55 C85,60 100,35 90,25 C75,10 55,30 50,50 Z" />
    </svg>

    <!-- Inferior Derecha -->
    <svg class="butterfly bf-bottom-right" style="--r: -10deg;" viewBox="0 0 100 100">
        <path fill="url(#butterfly-grad-2)" d="M50,50 C45,30 25,10 10,25 C0,35 15,60 30,55 C15,65 5,85 20,95 C35,100 45,75 50,60 C55,75 65,100 80,95 C95,85 85,65 70,55 C85,60 100,35 90,25 C75,10 55,30 50,50 Z" />
    </svg>


    <!-- CONTENIDO PRINCIPAL (TARJETA) -->
    <div class="card-container">
        <h1>SACÁ TU FOTO 🦋</h1>
        <p class="subtitle">Enfocá y capturá el momento</p>
        
        <div class="camera-box">
            <video id="webcam" autoplay playsinline muted></video>
            <canvas id="photo-canvas" style="display: none;"></canvas>
        </div>
        
        <button class="btn-capture" id="btn-snap">TOMAR Y GUARDAR FOTO</button>
    </div>

    <!-- SCRIPT DE CÁMARA (Para el visor real) -->
    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('photo-canvas');
        const button = document.getElementById('btn-snap');

        // Acceder a la cámara del celular (cámara trasera preferentemente)
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: "user" }, // Cambiar a "environment" para la cámara trasera o dejar "user" para selfie
                    audio: false
                });
                video.srcObject = stream;
            } catch (err) {
                console.error("Error al acceder a la cámara: ", err);
                alert("Por favor, permití el acceso a la cámara para poder sacarte la foto.");
            }
        }

        // Capturar foto
        button.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            // Dibujar el fotograma del video en el canvas
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Convertir a imagen y descargar (o subir a tu backend/Drive)
            const dataUrl = canvas.toDataURL('image/jpeg');
            
            // Simulación de guardado/descarga automática para el invitado
            const link = document.createElement('a');
            link.download = `cumple-foto-${Date.now()}.jpg`;
            link.href = dataUrl;
            link.click();
        });

        // Iniciar
        window.onload = startCamera;
    </script>
</body>
</html>
